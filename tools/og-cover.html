<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بطاقة المشاركة 1200×630</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; }

  #stage {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    direction: rtl;
    color: #ffffff;
    font-family: "Segoe UI", "Tahoma", "Noto Kufi Arabic", sans-serif;
    background: #04301c;
  }

  .bg {
    position: absolute;
    top: -240px;
    left: 0;
    width: 1200px;
    height: auto;
    display: block;
  }

  .veil {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right,
        rgba(4, 48, 28, 0) 0%,
        rgba(4, 48, 28, 0.35) 28%,
        rgba(4, 48, 28, 0.88) 47%,
        #04301c 60%,
        #04301c 100%),
      radial-gradient(620px 380px at 78% 0%, rgba(0, 224, 122, 0.18) 0%, transparent 70%);
  }

  .copy {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 64px 0 530px;
    z-index: 2;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    align-self: flex-start;
    font-size: 21px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.24);
    padding: 8px 20px;
    border-radius: 999px;
    margin-bottom: 24px;
    white-space: nowrap;
  }
  .brand b {
    background: #ffffff;
    color: #006233;
    padding: 2px 10px;
    border-radius: 6px;
    font-size: 17px;
    letter-spacing: 1px;
  }

  h1 {
    font-size: 62px;
    line-height: 1.16;
    font-weight: 900;
    letter-spacing: -0.5px;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
    white-space: nowrap;
  }
  h1 span { color: #7dffbe; }

  .role {
    font-size: 24px;
    margin-top: 14px;
    color: rgba(255, 255, 255, 0.88);
    line-height: 1.5;
  }

  .slogan {
    font-size: 31px;
    font-weight: 800;
    margin-top: 24px;
    border-right: 6px solid #00e07a;
    padding-right: 18px;
    line-height: 1.4;
    white-space: nowrap;
  }

  .url {
    margin-top: 32px;
    align-self: flex-start;
    direction: ltr;
    font-size: 19px;
    font-family: "Consolas", "Courier New", monospace;
    letter-spacing: .3px;
    background: rgba(0, 0, 0, 0.32);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 9px 20px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div id="stage">
    <img class="bg" src="../assets/img/abdhafid.jpeg" alt="">
    <div class="veil"></div>

    <div class="copy">
      <div class="brand"><b>RND</b> بلدية تاوة — الجزائر</div>
      <h1>لعجايلية <span>عبد الحفيظ</span></h1>
      <div class="role">محامٍ — مرشح لانتخابات المجلس الشعبي البلدي</div>
      <div class="slogan">معاً من أجل تنمية تاوة</div>
      <div class="url">adjailia.github.io/campaign-taoua</div>
    </div>
  </div>
</body>
</html>
